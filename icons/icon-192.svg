<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28221e"/>
      <stop offset="100%" stop-color="#14110f"/>
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="coralAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="192" height="192" rx="44" fill="url(#bgH)"/>
  <rect x="2" y="2" width="188" height="188" rx="42" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.25"/>

  <!-- Iconic 'H' + Balance / Ledger Symbol for Hisaab -->
  <g transform="translate(42, 42)">
    <!-- Left Pillar (Shivam) -->
    <rect x="12" y="14" width="22" height="80" rx="11" fill="url(#amberGold)"/>
    
    <!-- Right Pillar (Flatmate) -->
    <rect x="74" y="14" width="22" height="80" rx="11" fill="url(#coralAccent)"/>

    <!-- Central Bridge / Equal Split Bar -->
    <rect x="18" y="44" width="72" height="20" rx="10" fill="#faf5ee"/>

    <!-- Splitwise Balance Dot -->
    <circle cx="54" cy="54" r="5.5" fill="#14110f"/>

    <!-- Top floating currency rupee tick -->
    <circle cx="94" cy="18" r="5" fill="#fbbf24"/>
  </g>
</svg>
