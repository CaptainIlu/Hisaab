<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgH512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28221e"/>
      <stop offset="100%" stop-color="#14110f"/>
    </linearGradient>
    <linearGradient id="amberGold512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="coralAccent512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glowH" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgH512)"/>
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.25"/>

  <!-- Iconic 'H' + Balance / Ledger Symbol for Hisaab -->
  <g transform="translate(112, 112)" filter="url(#glowH)">
    <!-- Back Glow Ring -->
    <circle cx="144" cy="144" r="130" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.15"/>

    <!-- Left Pillar (Shivam) -->
    <rect x="32" y="36" width="56" height="216" rx="28" fill="url(#amberGold512)"/>
    
    <!-- Right Pillar (Flatmate) -->
    <rect x="200" y="36" width="56" height="216" rx="28" fill="url(#coralAccent512)"/>

    <!-- Central Bridge / Equal Split Bar -->
    <rect x="48" y="116" width="192" height="56" rx="28" fill="#faf5ee"/>

    <!-- Splitwise Balance Core -->
    <circle cx="144" cy="144" r="16" fill="#14110f"/>
    <circle cx="144" cy="144" r="8" fill="#f59e0b"/>

    <!-- Top floating currency indicator -->
    <circle cx="250" cy="46" r="14" fill="#fbbf24"/>
  </g>
</svg>
